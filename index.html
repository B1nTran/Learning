<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Ôn tập trắc nghiệm Tiếng Anh 12 - Global Success, Units 1, 2, 3 (90 câu hỏi).">
    <title>Trắc Nghiệm Tiếng Anh 12 - Global Success (Units 1, 2, 3)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <style>
        :root {
            --ok: #16a34a;
            --ok-soft: #dcfce7;
            --bad: #dc2626;
            --bad-soft: #fee2e2;
            --warn: #b45309;
            --warn-soft: #fef3c7;
        }
        [data-theme="light"] {
            --bg: #f3f6fc;
            --glow1: rgba(99, 102, 241, .18);
            --glow2: rgba(139, 92, 246, .14);
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --header-bg: rgba(255, 255, 255, .82);
            --footer-bg: rgba(255, 255, 255, .6);
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --primary: #6366f1;
            --primary-2: #8b5cf6;
            --primary-soft: #eef2ff;
            --primary-ink: #4338ca;
            --track: #e2e8f0;
            --key-bg: #eef2f7;
            --card-shadow: 0 2px 4px rgba(15, 23, 42, .03), 0 10px 24px -18px rgba(15, 23, 42, .25);
            --shadow: 0 18px 40px -22px rgba(15, 23, 42, .3);
        }
        [data-theme="dark"] {
            --bg: #080e1c;
            --glow1: rgba(79, 70, 229, .22);
            --glow2: rgba(124, 58, 237, .16);
            --surface: #0f172a;
            --surface-2: #131d33;
            --header-bg: rgba(10, 16, 30, .82);
            --footer-bg: rgba(10, 16, 30, .6);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: #1e293b;
            --border-strong: #334155;
            --primary: #818cf8;
            --primary-2: #a78bfa;
            --primary-soft: rgba(99, 102, 241, .16);
            --primary-ink: #c7d2fe;
            --track: #1e293b;
            --key-bg: #1e293b;
            --card-shadow: 0 2px 4px rgba(0, 0, 0, .2), 0 10px 24px -18px rgba(0, 0, 0, .6);
            --shadow: 0 20px 45px -25px rgba(0, 0, 0, .8);
            --ok-soft: rgba(22, 163, 74, .16);
            --bad-soft: rgba(220, 38, 38, .16);
            --warn-soft: rgba(180, 83, 9, .18);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1100px 560px at 8% -12%, var(--glow1), transparent 62%),
                radial-gradient(900px 480px at 108% -4%, var(--glow2), transparent 58%),
                var(--bg);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            transition: background-color .25s ease, color .25s ease;
        }
        .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 16px; }
        .hidden { display: none !important; }

        /* ---------- Sticky header + toolbar ---------- */
        .sticky-shell {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--header-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0 8px;
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand > div { min-width: 0; }
        .logo {
            width: 44px; height: 44px; flex: 0 0 44px;
            display: grid; place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: .04em;
            box-shadow: 0 8px 18px -8px rgba(99, 102, 241, .9);
        }
        .brand h1 {
            margin: 0 0 2px;
            font-size: 1.05rem;
            line-height: 1.25;
            font-weight: 750;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand p {
            margin: 0;
            font-size: .78rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
        .score-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary-ink);
            border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
            font-size: .84rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .score-chip b { font-size: .95rem; color: var(--primary-ink); }
        .icon-btn {
            width: 38px; height: 38px;
            display: grid; place-items: center;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: .18s ease;
        }
        .icon-btn:hover { border-color: var(--primary); transform: translateY(-1px); }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 6px 0 12px;
        }
        .progress-block { flex: 1 1 200px; min-width: 140px; max-width: 420px; }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: .73rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .progress-track {
            height: 7px;
            border-radius: 999px;
            background: var(--track);
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            transition: width .3s ease;
            position: relative;
            overflow: hidden;
        }
        #progressFill::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: translateX(-100%);
            animation: shimmer 2.2s ease-in-out infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 11px;
            border: 1px solid transparent;
            font-family: inherit;
            font-size: .86rem;
            font-weight: 650;
            white-space: nowrap;
            cursor: pointer;
            transition: .18s ease;
        }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            box-shadow: 0 8px 18px -10px rgba(99, 102, 241, .95);
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
        .btn-ghost {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border);
        }
        .btn-ghost:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

        /* ---------- Main ---------- */
        main { padding: 22px 0 36px; }

        .unit-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 26px 0 14px;
            padding: 14px 18px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            box-shadow: 0 12px 26px -16px rgba(99, 102, 241, .95);
        }
        .unit-head:first-child { margin-top: 0; }
        .unit-head h2 { margin: 2px 0 0; font-size: 1rem; font-weight: 700; line-height: 1.3; }
        .u-tag {
            display: inline-block;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .85);
        }
        .u-count {
            font-size: .74rem;
            font-weight: 650;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .2);
            white-space: nowrap;
        }

        .q-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: var(--card-shadow);
            scroll-margin-top: 165px;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .q-card + .q-card { margin-top: 11px; }
        .q-card:hover {
            border-color: var(--border-strong);
            box-shadow: 0 14px 30px -20px rgba(15, 23, 42, .4);
            transform: translateY(-2px);
        }
        .q-card.reveal { opacity: 0; transform: translateY(14px); }
        .q-card.reveal.in {
            opacity: 1;
            transform: none;
            transition: opacity .45s ease, transform .5s cubic-bezier(.2, .75, .25, 1), border-color .2s ease, box-shadow .2s ease;
        }
        .q-card.graded:hover { transform: none; }
        .q-card.is-blank { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
        .q-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .q-num {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary-ink);
            font-size: .74rem;
            font-weight: 700;
            letter-spacing: .02em;
        }
        .q-card.is-blank .q-num { background: var(--warn-soft); color: var(--warn); }
        .q-unit {
            font-size: .7rem;
            font-weight: 700;
            color: var(--muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 3px 9px;
            border-radius: 999px;
        }
        .grouped .q-unit { display: none; }
        .q-text {
            margin: 0 0 14px;
            font-size: .98rem;
            font-weight: 600;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .opt {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            font-size: .92rem;
            line-height: 1.4;
            cursor: pointer;
            transition: border-color .16s ease, background .16s ease, transform .16s ease;
        }
        .opt input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .opt:hover { border-color: var(--primary); background: var(--primary-soft); }
        .opt:has(input:focus-visible) {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .opt .key {
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--key-bg);
            color: var(--muted);
            font-size: .76rem;
            font-weight: 800;
            transition: .16s ease;
        }
        .opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
        .opt:has(input:checked) .key {
            background: var(--primary);
            color: #fff;
            animation: popKey .3s cubic-bezier(.34, 1.56, .64, 1);
        }
        @keyframes popKey {
            0% { transform: scale(.78); }
            60% { transform: scale(1.14); }
            100% { transform: scale(1); }
        }
        .opt-text { flex: 1; }

        .opt.correct,
        .opt.correct:has(input:checked) { border-color: var(--ok); background: var(--ok-soft); }
        .opt.correct .key,
        .opt.correct:has(input:checked) .key { background: var(--ok); color: #fff; }
        .opt.correct::after {
            content: "✓";
            margin-left: auto;
            color: var(--ok);
            font-weight: 800;
        }
        .opt.wrong,
        .opt.wrong:has(input:checked) { border-color: var(--bad); background: var(--bad-soft); }
        .opt.wrong .key,
        .opt.wrong:has(input:checked) .key { background: var(--bad); color: #fff; }
        .opt.wrong::after {
            content: "✕";
            margin-left: auto;
            color: var(--bad);
            font-weight: 800;
        }
        .graded .opt { cursor: default; transform: none; }

        .q-note-slot { display: contents; }
        .q-note {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 9px;
            background: var(--primary-soft);
            color: var(--muted);
            font-size: .81rem;
            line-height: 1.45;
        }
        .q-note b { color: var(--primary-ink); }
        .q-note.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
        .q-note.bad { background: var(--bad-soft); color: var(--bad); }
        .q-note.bad b { color: var(--bad); }
        .q-note.blank { background: var(--warn-soft); color: var(--warn); }
        .q-note.blank b { color: var(--warn); }

        /* ---------- Result ---------- */
        .result {
            position: relative;
            overflow: hidden;
            margin: 0 0 24px;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: linear-gradient(150deg, var(--surface), var(--surface-2));
            box-shadow: var(--shadow);
            scroll-margin-top: 160px;
            animation: pop .32s ease;
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(-8px) scale(.99); }
            to { opacity: 1; transform: none; }
        }
        .result-main {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }
        .score-orb {
            --pct: 0%;
            width: 116px;
            height: 116px;
            flex: 0 0 116px;
            padding: 7px;
            border-radius: 50%;
            background: conic-gradient(from -90deg, var(--primary) 0 var(--pct), var(--track) var(--pct) 100%);
            transition: background .55s ease;
        }
        .orb-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            line-height: 1;
        }
        .orb-inner span { font-size: 1.9rem; font-weight: 800; color: var(--primary-ink); }
        .orb-inner small { font-size: .7rem; font-weight: 650; color: var(--muted); }
        .result:not(.hidden) .score-orb {
            animation: orbGlow 2.6s ease-in-out infinite;
        }
        @keyframes orbGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
            50% { box-shadow: 0 0 26px 2px rgba(99, 102, 241, .28); }
        }
        .confetti {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            border-radius: inherit;
        }
        .confetti i {
            position: absolute;
            top: -14px;
            border-radius: 2px;
            opacity: .95;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(420px) rotate(540deg); opacity: 0; }
        }
        .result-copy { flex: 1 1 260px; min-width: 0; }
        .result-copy h2 { margin: 0 0 5px; font-size: 1.25rem; font-weight: 750; }
        .result-copy > p { margin: 0 0 12px; color: var(--muted); font-size: .88rem; }
        .res-stats { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .pill.ok { background: var(--ok-soft); color: var(--ok); }
        .pill.bad { background: var(--bad-soft); color: var(--bad); }
        .pill.mute { background: var(--surface); color: var(--muted); border-color: var(--border); }
        .res-units {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            scroll-margin-top: 160px;
        }
        .filter-tab {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-family: inherit;
            font-size: .82rem;
            font-weight: 650;
            cursor: pointer;
            transition: .2s ease;
        }
        .filter-tab b {
            font-size: .76rem;
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--track);
            color: var(--text);
            transition: .2s ease;
        }
        .filter-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .filter-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 18px -10px rgba(99, 102, 241, .95);
        }
        .filter-tab.active b {
            background: rgba(255, 255, 255, .25);
            color: #fff;
        }
        .filter-tab[data-filter="correct"].active {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            box-shadow: 0 8px 18px -10px rgba(34, 197, 94, .95);
        }
        .filter-tab[data-filter="wrong"].active {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 8px 18px -10px rgba(239, 68, 68, .95);
        }
        .empty-state {
            padding: 40px 20px;
            border: 1px dashed var(--border-strong);
            border-radius: 16px;
            background: var(--surface);
            color: var(--muted);
            text-align: center;
            font-size: .92rem;
        }
        .empty-state span { font-size: 1.6rem; display: block; margin-bottom: 8px; }
        .unit-stat {
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .us-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 7px;
            font-size: .75rem;
            font-weight: 600;
            color: var(--muted);
        }
        .us-top b { color: var(--text); }
        .us-bar {
            height: 6px;
            border-radius: 999px;
            background: var(--track);
            overflow: hidden;
        }
        .us-bar i {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            transition: width .6s ease;
        }

        .bottom-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 26px 0 8px;
            flex-wrap: wrap;
        }

        /* ---------- Footer ---------- */
        footer {
            margin-top: 20px;
            padding: 22px 0;
            border-top: 1px solid var(--border);
            background: var(--footer-bg);
        }
        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            text-align: center;
        }
        .footer-note { color: var(--muted); font-size: .84rem; }
        .gh-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: .85rem;
            font-weight: 650;
            text-decoration: none;
            transition: .18s ease;
        }
        .gh-link:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px -14px rgba(99, 102, 241, .9);
        }
        .gh-link svg { width: 19px; height: 19px; fill: currentColor; }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 100;
            padding: 10px 18px;
            border-radius: 999px;
            background: #111827;
            color: #fff;
            font-size: .84rem;
            font-weight: 500;
            box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .6);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 16px);
            transition: .25s ease;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 720px) {
            .res-units { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .brand p { display: none; }
            .logo { width: 38px; height: 38px; flex-basis: 38px; font-size: .9rem; border-radius: 11px; }
            .brand h1 { font-size: .94rem; }
            .score-chip { padding: 6px 10px; font-size: .76rem; }
            .options { grid-template-columns: 1fr; }
            .q-card { padding: 15px 15px; border-radius: 14px; }
            .q-text { font-size: .94rem; }
            .unit-head { padding: 12px 14px; }
            .unit-head h2 { font-size: .93rem; }
            .toolbar { gap: 10px; }
            .progress-block { max-width: none; }
            .toolbar-actions { width: 100%; }
            .toolbar-actions .btn { flex: 1; }
            .result { padding: 18px; }

            { id: 86, text: "The beach ______ we collected rubbish was much cleaner after the campaign.", options: ["where", "who", "whose", "whom"], correct: 0 },
            { id: 87, text: "The students ______ joined the tree-planting activity received certificates.", options: ["which", "whose", "who", "where"], correct: 2 },

            { id: 89, text: "Using public transport is one of the most effective ways to reduce our carbon ______.", options: ["footprint", "tradition", "biography", "achievement"], correct: 0 },
            { id: 90, text: "We should all take responsibility ______ protecting the environment.", options: ["at", "for", "with", "by"], correct: 1 }
        ];

        const LABELS = ['A', 'B', 'C', 'D'];
        const TOTAL = questionsData.length;
        const UNIT_META = {
            1: { name: "Life Stories We Admire", short: "Life Stories", from: 1, to: 30 },
            2: { name: "A Multicultural World", short: "Multicultural World", from: 31, to: 60 },
            3: { name: "Green Living", short: "Green Living", from: 61, to: 90 }
        };

        const qById = Object.fromEntries(questionsData.map(q => [q.id, q]));
        const originalOrder = questionsData.map(q => q.id);

        let order = originalOrder.slice();
        let answers = {};
        let submitted = false;
        let shuffled = false;
        let currentFilter = 'all';

        const $ = id => document.getElementById(id);
        const container = $('questionsContainer');
        const quizForm = $('quizForm');
        const resultPanel = $('resultPanel');

        function unitOf(id) { return id <= 30 ? 1 : id <= 60 ? 2 : 3; }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function unitHeader(unit) {
            const meta = UNIT_META[unit];
            return `
                <div class="unit-head">
                    <div>
                        <span class="u-tag">Unit ${unit}</span>
                        <h2>${meta.name}</h2>
                    </div>
                    <span class="u-count">${meta.to - meta.from + 1} câu</span>
                </div>`;
        }

        function questionCard(q, displayNumber) {
            const unit = unitOf(q.id);
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                const checked = answers[q.id] === i ? ' checked' : '';
                optionsHtml += `
                    <label class="opt" data-o="${i}">
                        <input type="radio" name="q${q.id}" value="${i}"${checked}${submitted ? ' disabled' : ''}>
                        <span class="key">${LABELS[i]}</span>
                        <span class="opt-text">${escapeHtml(opt)}</span>
                    </label>`;
            });

            return `
                <div class="q-card" id="card-${q.id}">
                    <div class="q-head">
                        <span class="q-num">Câu ${displayNumber}</span>
                        <span class="q-unit">Unit ${unit}</span>
                    </div>
                    <p class="q-text">${escapeHtml(q.text)}</p>
                    <div class="options">${optionsHtml}</div>
                    <div class="q-note-slot"></div>
                </div>`;
        }

        function render() {
            let html = '';
            let lastUnit = null;
            let visible = 0;

            order.forEach((id, index) => {
                if (!matchesFilter(id)) return;
                visible++;
                const unit = unitOf(id);
                if (!shuffled && currentFilter === 'all' && unit !== lastUnit) {
                    html += unitHeader(unit);
                    lastUnit = unit;
                }
                html += questionCard(qById[id], index + 1);
            });

            if (visible === 0) {
                html = `<div class="empty-state"><span>🎯</span>Không có câu nào trong mục này. Chọn tab khác để xem tiếp nhé!</div>`;
            }

            container.innerHTML = html;
            container.classList.toggle('grouped', !shuffled && currentFilter === 'all');
            container.classList.toggle('filtered', currentFilter !== 'all');
            container.classList.toggle('graded', submitted);
            container.classList.toggle('shuffled', shuffled);

            if (submitted) {
                container.querySelectorAll('.q-card').forEach(card => {
                    const id = Number(card.id.replace('card-', ''));
                    gradeCard(qById[id], card);
                });
            }

            revealCards();
            syncFilterTabs();
        }

        function matchesFilter(id) {
            if (!submitted || currentFilter === 'all') return true;
            const q = qById[id];
            const chosen = answers[id];
            if (currentFilter === 'correct') return chosen !== undefined && chosen === q.correct;
            if (currentFilter === 'wrong') return chosen !== undefined && chosen !== q.correct;
            if (currentFilter === 'blank') return chosen === undefined;
            return true;
        }

        function gradeCard(q, card) {
            const slot = card.querySelector('.q-note-slot');
            const correctOpt = card.querySelector(`.opt[data-o="${q.correct}"]`);
            if (correctOpt) correctOpt.classList.add('correct');

            const chosen = answers[q.id];
            card.classList.remove('is-blank');
            if (chosen === undefined) {
                card.classList.add('is-blank');
                slot.innerHTML = `<div class="q-note blank">Chưa trả lời · Đáp án đúng: <b>${LABELS[q.correct]}. ${escapeHtml(q.options[q.correct])}</b></div>`;
            } else if (chosen !== q.correct) {
                const wrongOpt = card.querySelector(`.opt[data-o="${chosen}"]`);
                if (wrongOpt) wrongOpt.classList.add('wrong');
                slot.innerHTML = `<div class="q-note bad">Đáp án đúng: <b>${LABELS[q.correct]}. ${escapeHtml(q.options[q.correct])}</b></div>`;
            }
        }

        let revealObserver = null;
        if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            revealObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in');
                        revealObserver.unobserve(entry.target);
                        setTimeout(() => entry.target.classList.remove('reveal', 'in'), 600);
                    }
                });
            }, { threshold: .04, rootMargin: '0px 0px -20px 0px' });
        }

        function revealCards() {
            const cards = container.querySelectorAll('.q-card');
            cards.forEach(card => {
                if (!revealObserver) {
                    card.classList.add('in');
                    return;
                }
                card.classList.add('reveal');
                revealObserver.observe(card);
            });
        }

        function syncFilterTabs() {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                const active = tab.dataset.filter === currentFilter;
                tab.classList.toggle('active', active);
                tab.setAttribute('aria-selected', active ? 'true' : 'false');
            });
        }

        function answeredCount() { return Object.keys(answers).length; }

        function updateProgress() {
            const count = answeredCount();
            const pct = Math.round(count / TOTAL * 100);
            $('progressText').textContent = `${count}/${TOTAL} câu`;
            $('progressPct').textContent = `${pct}%`;
            $('progressFill').style.width = `${pct}%`;
            $('progressBar').setAttribute('aria-valuenow', String(count));
        }

        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), 1900);
        }

        function animateNumber(el, target) {
            const duration = 650;
            const start = performance.now();
            function step(now) {
                const p = Math.min(1, (now - start) / duration);
                el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
            setTimeout(() => { el.textContent = target; }, duration + 120);
        }

        function checkAnswers() {
            const blankBefore = TOTAL - answeredCount();
            if (!submitted && blankBefore > 0) {
                const ok = confirm(`Bạn còn ${blankBefore} câu chưa trả lời. Vẫn nộp bài?`);
                if (!ok) return;
            }

            submitted = true;
            currentFilter = 'all';
            let score = 0, wrong = 0, blank = 0;
            const unitStats = {
                1: { correct: 0, total: 30 },
                2: { correct: 0, total: 30 },
                3: { correct: 0, total: 30 }
            };

            questionsData.forEach(q => {
                const card = $('card-' + q.id);
                if (card) gradeCard(q, card);

                const unit = unitOf(q.id);
                const chosen = answers[q.id];
                if (chosen === undefined) {
                    blank++;
                } else if (chosen === q.correct) {
                    score++;
                    unitStats[unit].correct++;
                } else {
                    wrong++;
                }
            });

            container.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);

            // Result panel
            const pct = Math.round(score / TOTAL * 100);
            $('resOrb').style.setProperty('--pct', pct + '%');
            animateNumber($('resScore'), score);
            $('resCorrect').textContent = score;
            $('resWrong').textContent = wrong;
            $('resBlank').textContent = blank;

            let title = "Kết quả của bạn", msg = "";
            if (pct >= 90) { title = "Xuất sắc! 🏆"; msg = "Phong độ đỉnh cao — bạn đã nắm rất chắc kiến thức Units 1–3."; }
            else if (pct >= 80) { title = "Rất tốt! 🎉"; msg = "Chỉ còn một vài lỗi nhỏ, ôn thêm là hoàn hảo."; }
            else if (pct >= 65) { title = "Khá tốt 👍"; msg = "Nền tảng ổn rồi, xem lại các câu sai để tiến bộ nhanh hơn."; }
            else if (pct >= 50) { title = "Cần cố gắng thêm 💪"; msg = "Bạn đã làm đúng một nửa — ôn lại từ vựng và ngữ pháp trọng tâm nhé."; }
            else { title = "Đừng nản, luyện thêm nhé 🌱"; msg = "Xem kỹ đáp án đúng bên dưới rồi thử lại lần nữa, bạn sẽ tiến bộ rõ rệt."; }
            $('resTitle').textContent = title;
            $('resMsg').textContent = `${msg} Bạn đạt ${pct}% (${score}/${TOTAL} điểm).`;

            $('resUnits').innerHTML = [1, 2, 3].map(u => {
                const s = unitStats[u];
                const p = Math.round(s.correct / s.total * 100);
                return `
                    <div class="unit-stat">
                        <div class="us-top"><span>Unit ${u} · ${UNIT_META[u].short}</span><b>${s.correct}/${s.total}</b></div>
                        <div class="us-bar"><i style="width:${p}%"></i></div>
                    </div>`;
            }).join('');

            $('scoreBadge').innerHTML = `Điểm: <b>${score}</b>/${TOTAL}`;
            resultPanel.classList.remove('hidden');
            $('resetBtn').classList.remove('hidden');
            $('resetBtn2').classList.remove('hidden');
            $('shuffleBtn').disabled = true;
            $('submitBtn').disabled = true;
            $('submitBtn2').disabled = true;

            $('filterBar').classList.remove('hidden');
            $('countAll').textContent = TOTAL;
            $('countCorrect').textContent = score;
            $('countWrong').textContent = wrong;
            $('countBlank').textContent = blank;
            $('countBlank').closest('.filter-tab').classList.toggle('hidden', blank === 0);
            syncFilterTabs();

            if (pct >= 80) celebrate();

            requestAnimationFrame(() => resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        }

        function celebrate() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const layer = document.createElement('div');
            layer.className = 'confetti';
            const colors = ['#6366f1', '#8b5cf6', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4'];
            for (let i = 0; i < 30; i++) {
                const piece = document.createElement('i');
                piece.style.left = (Math.random() * 100) + '%';
                piece.style.background = colors[i % colors.length];
                piece.style.width = (5 + Math.random() * 6) + 'px';
                piece.style.height = (7 + Math.random() * 7) + 'px';
                piece.style.animationDelay = (Math.random() * .5) + 's';
                piece.style.animationDuration = (1.3 + Math.random() * 1.2) + 's';
                layer.appendChild(piece);
            }
            resultPanel.appendChild(layer);
            setTimeout(() => layer.remove(), 3200);
        }

        function setFilter(filter) {
            if (!submitted) return;
            currentFilter = filter;
            render();
            $('filterBar').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetQuiz() {
            answers = {};
            submitted = false;
            shuffled = false;
            currentFilter = 'all';
            order = originalOrder.slice();

            quizForm.reset();
            resultPanel.classList.add('hidden');
            $('filterBar').classList.add('hidden');
            resultPanel.querySelectorAll('.confetti').forEach(el => el.remove());
            $('resetBtn').classList.add('hidden');
            $('resetBtn2').classList.add('hidden');
            $('shuffleBtn').disabled = false;
            $('submitBtn').disabled = false;
            $('submitBtn2').disabled = false;
            $('scoreBadge').innerHTML = 'Điểm: <b>–</b>/90';
            $('shuffleBtn').textContent = '🔀 Đảo câu';

            render();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('Đã làm mới bài tập');
        }

        function toggleShuffle() {
            if (submitted) return;
            shuffled = !shuffled;

            if (shuffled) {
                order = originalOrder.slice();
                for (let i = order.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [order[i], order[j]] = [order[j], order[i]];
                }
                $('shuffleBtn').textContent = '↩ Thứ tự gốc';
                showToast('Đã đảo thứ tự 90 câu hỏi');
            } else {
                order = originalOrder.slice();
                $('shuffleBtn').textContent = '🔀 Đảo câu';
                showToast('Đã trả về thứ tự gốc');
            }

            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Events
        container.addEventListener('change', e => {
            const input = e.target.closest('input[type="radio"]');
            if (!input) return;
            answers[input.name.slice(1)] = Number(input.value);
            updateProgress();
        });

        $('submitBtn').addEventListener('click', checkAnswers);
        $('submitBtn2').addEventListener('click', checkAnswers);
        $('resetBtn').addEventListener('click', resetQuiz);
        $('resetBtn2').addEventListener('click', resetQuiz);
        $('shuffleBtn').addEventListener('click', toggleShuffle);
        $('filterBar').addEventListener('click', e => {
            const tab = e.target.closest('.filter-tab');
            if (tab) setFilter(tab.dataset.filter);
        });

        // Theme
        const themeBtn = $('themeBtn');
        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
            themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối');
        }
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('quiz-theme'); } catch (err) {}
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

        themeBtn.addEventListener('click', () => {
            const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem('quiz-theme', next); } catch (err) {}
        });

        // Init
        $('year').textContent = new Date().getFullYear();
        render();
        updateProgress();
    </script>
</body>
</html>
